name: Build SpeedScope APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls SpeedScope_src.zip 2>/dev/null || ls *.zip | head -n1)
          echo "Using $ZIP"
          unzip -oq "$ZIP"
          ls SpeedScope

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        shell: bash
        working-directory: SpeedScope
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee build.log

      - name: Build debug APK
        shell: bash
        working-directory: SpeedScope
        run: gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee build2.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedScope-debug-apk
          path: SpeedScope/app/build/outputs/apk/debug/*.apk

      - name: Show errors
        if: failure()
        working-directory: SpeedScope
        run: |
          echo "===== ERRORS ====="
          cat build.log build2.log 2>/dev/null | grep -E "^e: |What went wrong|Execution failed|error:" -A3 | head -120
